<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b35"><title>Family Finance · Recovery</title><style>body{font:16px system-ui;background:#f3f7f5;color:#123b35;padding:20px;max-width:650px;margin:auto}button,a{display:inline-block;padding:13px;border-radius:9px;margin:6px 0;background:#123b35;color:white;text-decoration:none;border:0;font-size:16px}button{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border-radius:9px}p{line-height:1.5}</style></head><body><h1>Family Finance Recovery</h1><p>This page does not load the normal app, calculate reports, or modify transactions. Use it on the <strong>same installed iPhone app</strong> where your data was imported. Safari may have different storage.</p><button id="check">1. Check private data</button><button id="backup">2. Download private backup JSON</button><pre id="status">No data read yet.</pre><a href="./index.html">Return to Family Finance</a><script>
const out=document.getElementById('status');const NAME='family-finance-workbook-v05',KEY='familyfinance_v02';
function open(){return new Promise((ok,no)=>{const r=indexedDB.open(NAME,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('ledger'))r.result.createObjectStore('ledger');if(!r.result.objectStoreNames.contains('archive'))r.result.createObjectStore('archive')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function load(){const d=await open();try{return await new Promise((ok,no)=>{const r=d.transaction('ledger','readonly').objectStore('ledger').get('current');r.onsuccess=()=>ok(r.result?.data||null);r.onerror=()=>no(r.error)})}finally{d.close()}}
function local(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
async function check(){out.textContent='Checking…';try{const x=await load(),y=local();out.textContent='IndexedDB transactions: '+(x?.transactions?.length??'none')+'\nLocal cache transactions: '+(y?.transactions?.length??'none')+'\nNo data has been changed.'}catch(e){out.textContent='Could not read storage: '+e.message}}
document.getElementById('check').onclick=check;
document.getElementById('backup').onclick=async()=>{out.textContent='Preparing private backup…';try{const x=await load()||local();if(!x||!Array.isArray(x.transactions))throw Error('No ledger found in this app storage');const blob=new Blob([JSON.stringify(x)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='family-finance-RECOVERY-PRIVATE-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);out.textContent='Backup prepared: '+x.transactions.length+' transactions. Save the file privately; NEVER upload it to your public GitHub repository.'}catch(e){out.textContent='Backup failed: '+e.message}};
check();</script></body></html>
